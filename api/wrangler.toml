name = "tsumi-note-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 重要: top-level には APP_ENV・D1・vars を置かない。
# `wrangler deploy` を環境指定なしで実行しても、APP_ENV 未設定のため Worker は 500 で停止し、
# 開発設定が公開環境で有効になることはない(src/index.ts)。
# 本番は `bun run deploy`(--env production 固定)、開発は `bun run dev`(--env development)を使う。
# 秘密情報(BETTER_AUTH_SECRET / RESEND_API_KEY 等)は `wrangler secret put <NAME> --env <env>` で登録する。
# 詳細は docs/PHASE8_SETUP.md を参照。

# ---- 開発環境(ローカル専用。デプロイ用途ではない) ----
[env.development]
name = "tsumi-note-api-development"
[env.development.triggers]
crons = ["17 3 * * *"] # 削除済みアカウントのR2残骸の掃除
[env.development.vars]
APP_ENV = "development"
BETTER_AUTH_URL = "http://localhost:8787"
EMAIL_FROM = "つみノート <noreply@hosokawa-lab.dev>"
APP_SCHEME = "tsumi-note"
# app.json の ios.bundleIdentifier。Apple の設定(Capability)自体は未確認
APPLE_APP_BUNDLE_ID = "dev.hosokawalab.tsuminote"
# Google の iOS クライアントID(カンマ区切り)。発行後に設定する。未設定なら Google ログインは無効
# GOOGLE_CLIENT_IDS = ""
[[env.development.d1_databases]]
binding = "DB"
database_name = "tsumi-note-db"
# `wrangler d1 create tsumi-note-db` の出力値に置き換える(未設定)
database_id = "2aed7628-a4ed-405e-adb6-3b3660c95f4a"
migrations_dir = "migrations"
# ノート画像(非公開バケット)。`wrangler r2 bucket create tsumi-note-images-development` で作成する
[[env.development.r2_buckets]]
binding = "IMAGES"
bucket_name = "tsumi-note-images-development"

# ---- 本番環境 ----
# 以下のダミー値(example.invalid / 0000…)が残っていると `bun run deploy` は事前チェックで失敗する。
[env.production]
name = "tsumi-note-api-production"
[env.production.triggers]
crons = ["17 3 * * *"] # 削除済みアカウントのR2残骸の掃除
[env.production.vars]
APP_ENV = "production"
BETTER_AUTH_URL = "https://api.tsumi-note.hosokawa-lab.dev"
EMAIL_FROM = "つみノート <noreply@hosokawa-lab.dev>"
APP_SCHEME = "tsumi-note"
APPLE_APP_BUNDLE_ID = "dev.hosokawalab.tsuminote"
# GOOGLE_CLIENT_IDS = ""
# Universal Links を使う場合のみ設定(例: "https://links.example.com")。
# APP_UNIVERSAL_LINK_ORIGIN = ""
[[env.production.d1_databases]]
binding = "DB"
database_name = "tsumi-note-prod"
database_id = "9fb89905-ff01-44a2-bbbd-10f24c501be2"
migrations_dir = "migrations"
# `wrangler r2 bucket create tsumi-note-images-production`(公開アクセスは有効にしない)
[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "tsumi-note-images-production"
[[env.production.routes]]
pattern = "api.tsumi-note.hosokawa-lab.dev"
custom_domain = true
