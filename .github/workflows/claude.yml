name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Claude起動前にラッパースクリプトが存在することを確認
      - name: Verify Figma wrapper
        run: |
          echo "=== Working directory ==="
          pwd

          echo "=== Git branch ==="
          git branch --show-current || true

          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Repository root ==="
          ls -la

          echo "=== Figma wrapper ==="
          ls -l ./figma-fetch

          test -f ./figma-fetch
          test -x ./figma-fetch

          echo "Figma wrapper is ready."

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          settings: |
            {
              "env": {
                "FIGMA_ACCESS_TOKEN": "${{ secrets.FIGMA_ACCESS_TOKEN }}"
              }
            }

          claude_args: |
            --append-system-prompt "GitHub上でユーザーに表示するIssueコメント、Pull Requestのタイトル・本文、作業報告、エラー報告、テスト結果、Figmaとの差異、懸念事項、確認事項は原則として日本語で記述してください。コード、コマンド、ファイル名、API名、ライブラリ名、原文のエラーメッセージなどは必要に応じて英語のままで構いません。FigmaはVisual DesignのSource of Truthとして扱ってください。Figmaデザインを取得する場合はcurlを直接実行せず、必ずリポジトリルートの ./figma-fetch を使用してください。FIGMA_ACCESS_TOKENの値そのものをログ、Issueコメント、PR本文、コード等へ絶対に出力しないでください。リポジトリにCLAUDE.mdが存在する場合は、その指示にも従ってください。"
            --allowedTools "Read,Edit,Bash(./figma-fetch:*),Bash(bun:*),Bash(bunx:*),Bash(npx:*),Bash(node:*),Bash(npm view:*),Bash(git fetch:*),Bash(git checkout:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*)"