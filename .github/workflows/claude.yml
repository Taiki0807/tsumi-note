name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Figma MCP config
        run: |
          cat > /tmp/figma-mcp.json << 'EOF'
          {
            "mcpServers": {
              "figma-developer-mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "figma-developer-mcp",
                  "--stdio"
                ],
                "env": {
                  "FIGMA_API_KEY": "${{ secrets.FIGMA_ACCESS_TOKEN }}"
                }
              }
            }
          }
          EOF

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: |
            --mcp-config /tmp/figma-mcp.json
            --append-system-prompt "GitHub上でユーザーに表示するIssueコメント、Pull Requestのタイトル・本文、作業報告、エラー報告、テスト結果、確認事項は原則として日本語で記述してください。Figmaデザインを確認する場合はFigma MCPを使用し、FigmaをVisual DesignのSource of Truthとして扱ってください。リポジトリにCLAUDE.mdが存在する場合は、その指示にも従ってください。"
            --allowedTools "mcp__figma-developer-mcp__get_figma_data,mcp__figma-developer-mcp__download_figma_images,Bash(bun:*),Bash(bunx:*),Bash(npx:*),Bash(node:*),Bash(npm view:*),Bash(git fetch:*),Bash(git checkout:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*)"